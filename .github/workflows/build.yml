name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and renders
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest
      - name: Build
        run: ./gradlew assembleGithubDebug bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: svitlograf-github-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: app/build/renders/*.png
